<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FORK-MUSICA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:25px 15px;
 background:#100d1c;color:white;
 font-family:Arial,sans-serif;
}
.container{max-width:750px;margin:auto}
header{text-align:center;margin-bottom:35px}
.logo{font-size:30px;font-weight:bold;color:#bd83ff}
h1{font-size:35px;margin-bottom:10px}
.sub{color:#c6bdd5;line-height:1.6}
.card{
 background:#1c172b;padding:25px;
 border-radius:18px;margin-bottom:20px;
 border:1px solid #392d50;
}
label{display:block;margin:18px 0 8px;font-weight:bold}
input,select,textarea{
 width:100%;padding:13px;border-radius:9px;
 border:1px solid #59466f;background:#110e1b;
 color:white;font-size:15px;
}
textarea{min-height:110px;resize:vertical}
button{
 width:100%;padding:15px;margin-top:20px;
 border:0;border-radius:10px;
 background:linear-gradient(90deg,#8d43e8,#c05bff);
 color:white;font-size:17px;font-weight:bold;
 cursor:pointer;
}
button:hover{opacity:.9}
#resultado{display:none;white-space:pre-wrap;line-height:1.8}
#resultado h2{color:#ce9aff}
.nota{color:#a99dbb;font-size:13px;text-align:center}
</style>
</head>

<body>
<div class="container">

<header>
<div class="logo">🎵 FORK-MUSICA</div>
<h1>Tu vida tiene una canción</h1>
<p class="sub">Cuéntanos tu historia y nosotros la convertiremos en una letra musical única.</p>
</header>

<div class="card">
<h2>❤️ ¿Para quién es tu canción?</h2>

<label>¿A quién quieres dedicarla?</label>
<select id="persona">
<option value="mi amor">Mi pareja</option>
<option value="mi esposa">Mi esposa</option>
<option value="mi esposo">Mi esposo</option>
<option value="mi novia">Mi novia</option>
<option value="mi novio">Mi novio</option>
<option value="mi madre">Mi madre</option>
<option value="mi padre">Mi padre</option>
<option value="un amigo">Un amigo</option>
<option value="mi familia">Mi familia</option>
<option value="mí mismo">A mí mismo</option>
</select>

<label>Nombre de la persona (opcional)</label>
<input id="nombre" placeholder="Ejemplo: María">

<label>¿Qué ocasión celebras?</label>
<select id="ocasion">
<option>Una sorpresa especial</option>
<option>Un aniversario</option>
<option>Un cumpleaños</option>
<option>Una declaración de amor</option>
<option>Una boda</option>
<option>Un homenaje</option>
<option>Una amistad</option>
<option>Superación personal</option>
</select>

<label>¿Dónde se conocieron o qué recuerdo especial tienen?</label>
<textarea id="historia" placeholder="Cuéntanos cómo comenzó todo..."></textarea>

<label>¿Qué es lo que más te gusta de esa persona?</label>
<textarea id="cualidad" placeholder="Su sonrisa, su forma de ser, cómo te hace sentir..."></textarea>

<label>¿Qué mensaje quieres transmitir?</label>
<textarea id="mensaje" placeholder="Escribe lo que quisieras decirle..."></textarea>
</div>

<div class="card">
<h2>🎼 Personaliza tu música</h2>

<label>Género musical</label>
<select id="genero">
<option>Bachata</option>
<option>Pop romántico</option>
<option>Reggaetón romántico</option>
<option>Cumbia</option>
<option>Balada</option>
<option>Salsa</option>
<option>Rock</option>
<option>Rap</option>
<option>Folklore</option>
<option>Merengue</option>
</select>

<label>Tipo de voz</label>
<select id="voz">
<option>Voz masculina</option>
<option>Voz femenina</option>
<option>Dueto</option>
</select>

<label>Estilo de la canción</label>
<select id="estilo">
<option>Romántica y suave</option>
<option>Emotiva y sentimental</option>
<option>Alegre y divertida</option>
<option>Triste y nostálgica</option>
<option>Apasionada</option>
<option>Enérgica</option>
</select>

<button onclick="crearCancion()">✨ CREAR MI LETRA GRATIS</button>
</div>

<div class="card" id="resultado">
<h2>🎤 Tu canción está lista</h2>
<div id="letra"></div>
<button onclick="copiarLetra()">📋 COPIAR MI CANCIÓN</button>
<button onclick="crearCancion()">🔄 CREAR OTRA VERSIÓN</button>
</div>

<p class="nota">FORK-MUSICA · Cada historia merece su propia canción.</p>

</div>

<script>
function crearCancion(){
 const persona=document.getElementById("persona").value;
 const nombre=document.getElementById("nombre").value.trim() || persona;
 const ocasion=document.getElementById("ocasion").value;
 const historia=document.getElementById("historia").value.trim();
 const cualidad=document.getElementById("cualidad").value.trim();
 const mensaje=document.getElementById("mensaje").value.trim();
 const genero=document.getElementById("genero").value;
 const voz=document.getElementById("voz").value;
 const estilo=document.getElementById("estilo").value;

 if(!historia && !cualidad && !mensaje){
  alert("Cuéntanos al menos un detalle para crear tu canción.");
  return;
 }

 const limpiar=(texto)=>texto.replace(/[.!?]+$/,"");

 const elegir=(lista)=>{
  return lista[Math.floor(Math.random()*lista.length)];
 };

 const elegirVarias=(lista,cantidad)=>{
  const copia=[...lista];
  const resultado=[];
  for(let i=0;i<cantidad && copia.length>0;i++){
   const indice=Math.floor(Math.random()*copia.length);
   resultado.push(copia.splice(indice,1)[0]);
  }
  return resultado;
 };

 const comienzos=[
 "Hay historias que comienzan sin avisar,",
 "Nunca imaginé que te iba a encontrar,",
 "Entre millones de caminos llegaste a mi vida,",
 "A veces el destino tiene sus propias razones,",
 "Todo comenzó sin saber lo que vendría,"
 ];

 const versos=[
 "Y poco a poco te volviste parte de mis días,",
 "Hay recuerdos que todavía me hacen sonreír,",
 "Cada momento contigo tiene algo especial,",
 "No necesito tenerlo todo si te puedo encontrar,",
 "Hay instantes pequeños que se vuelven eternos,",
 "Contigo aprendí que querer también es cuidar,",
 "Y hasta los días grises pueden volver a brillar,",
 "Porque algunas personas llegan para cambiarlo todo,",
 "No existe un mapa para encontrar la felicidad,",
 "A veces una sonrisa puede cambiar una realidad,"
 ];

 const coros=[
 "Y quiero que sepas que te volvería a elegir,",
 "Eres esa canción que quiero repetir,",
 "Si el mundo se detiene, contigo quiero estar,",
 "No necesito razones para volverte a amar,",
 "Que lo sepa el mundo, que lo escuche el corazón,",
 "Lo que siento por ti no cabe en una canción,",
 "Y si pudiera pedir un deseo al despertar,",
 "Sería tener mil momentos más para compartir,"
 ];

 const puentes=[
 "Y si la vida nos pone a prueba alguna vez,",
 "No todo será perfecto, eso lo sé,",
 "Pero mientras queden sueños por cumplir,",
 "Siempre habrá una razón para seguir,",
 "Que pasen los años, que cambie la estación,",
 "Hay sentimientos que no entienden de tiempo,",
 "Y lo que nace de verdad deja huellas,"
 ];

 const finales=[
 "Esta historia todavía tiene mucho que contar,",
 "Y quedan tantos sueños por alcanzar,",
 "Que nunca se apague esta emoción,",
 "Porque siempre tendrás un lugar en mi corazón,",
 "Lo mejor de esta historia está por comenzar,",
 "Y esta canción te lo quiere recordar,"
 ];

 const inicio=elegir(comienzos);
 const versosElegidos=elegirVarias(versos,4);
 const corosElegidos=elegirVarias(coros,4);
 const puenteElegido=elegirVarias(puentes,3);
 const finalElegido=elegirVarias(finales,2);

 const titulo=nombre+" - Una historia hecha canción";

 const texto=
 "🎵 "+titulo+"\n"+
 "Género: "+genero+"\n"+
 "Voz: "+voz+"\n"+
 "Estilo: "+estilo+"\n"+
 "Ocasión: "+ocasion+"\n\n"+

 "🎤 INTRODUCCIÓN\n"+
 inicio+"\n"+
 elegir(comienzos)+"\n"+
 "Hay algo que hoy quiero decirte,\n"+
 "y por eso convertí mis sentimientos en música.\n\n"+

 "🎶 VERSO 1\n"+
 (historia ? limpiar(historia)+"," : "Desde que llegaste algo cambió,")+"\n"+
 versosElegidos[0]+"\n"+
 versosElegidos[1]+"\n"+
 elegir(comienzos)+"\n\n"+

 "🎶 PRE-CORO\n"+
 "Y aunque a veces me cueste explicar,\n"+
 "todo lo que llevo dentro y no puedo ocultar,\n"+
 versosElegidos[2]+"\n"+
 corosElegidos[0]+"\n\n"+

 "❤️ CORO\n"+
 nombre+", esta canción es para ti,\n"+
 (mensaje ? limpiar(mensaje)+"," : "porque eres especial para mí,")+"\n"+
 corosElegidos[1]+"\n"+
 corosElegidos[2]+"\n"+
 "Y si tuviera que volver a comenzar,\n"+
 "mil veces te volvería a encontrar.\n\n"+

 "🎶 VERSO 2\n"+
 (cualidad ? limpiar(cualidad)+"," : "Tu manera de ser me hace sonreír,")+"\n"+
 versosElegidos[3]+"\n"+
 "Son esos detalles que no se pueden comprar,\n"+
 "los que hacen que esta historia sea especial.\n"+
 "Y todavía quedan sueños por vivir,\n"+
 "y muchos caminos por descubrir.\n\n"+

 "❤️ CORO\n"+
 nombre+", esta canción es para ti,\n"+
 (mensaje ? limpiar(mensaje)+"," : "porque eres especial para mí,")+"\n"+
 corosElegidos[0]+"\n"+
 corosElegidos[2]+"\n"+
 corosElegidos[3]+"\n\n"+

 "🎼 PUENTE\n"+
 puenteElegido[0]+"\n"+
 puenteElegido[1]+"\n"+
 "No prometo que todo sea fácil,\n"+
 "pero sí que esta historia vale la pena.\n"+
 puenteElegido[2]+"\n\n"+

 "🌟 CORO FINAL\n"+
 "Que se escuche fuerte esta canción,\n"+
 "que hable por mí y por mi corazón.\n"+
 nombre+", nunca dejes de recordar,\n"+
 "que hay momentos que no se pueden reemplazar.\n"+
 corosElegidos[1]+"\n"+
 finalElegido[0]+"\n"+
 finalElegido[1]+"\n\n"+

 "🎤 DESPEDIDA\n"+
 "Hoy esta historia se convirtió en canción,\n"+
 "nació de un recuerdo y de una emoción.\n"+
 "Y mientras existan motivos para sentir,\n"+
 "siempre habrá una canción por escribir.";

 document.getElementById("letra").textContent=texto;
 document.getElementById("resultado").style.display="block";
 document.getElementById("resultado").scrollIntoView({behavior:"smooth"});
}
function copiarLetra(){
 const texto=document.getElementById("letra").textContent;
 navigator.clipboard.writeText(texto)
 .then(()=>alert("¡Tu canción fue copiada!"));
}
</script>
</body>
</html>
