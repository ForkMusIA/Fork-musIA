<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fork-MUSICA | Crea tu música con IA</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#10101c;
color:white;
}
header{
padding:25px;
text-align:center;
background:#19192c;
border-bottom:1px solid #333;
}
.logo{
font-size:32px;
font-weight:bold;
color:#b78aff;
}
header p{color:#bbb}
main{
max-width:750px;
margin:40px auto;
padding:25px;
}
h1{text-align:center;font-size:34px}
.descripcion{text-align:center;color:#bbb}
.panel{
background:#1d1d30;
padding:25px;
border-radius:18px;
margin-top:30px;
}
label{
display:block;
margin:18px 0 8px;
color:#d5c2ff;
}
input,textarea,select{
width:100%;
padding:14px;
border-radius:9px;
border:1px solid #444;
background:#11111e;
color:white;
font-size:16px;
}
textarea{height:110px;resize:vertical}
button{
width:100%;
padding:16px;
margin-top:22px;
border:0;
border-radius:10px;
background:linear-gradient(90deg,#8b45ff,#d04cff);
color:white;
font-size:17px;
font-weight:bold;
cursor:pointer;
}
button:hover{opacity:.85}
#resultado{
display:none;
margin-top:25px;
padding:20px;
background:#11111e;
border-radius:12px;
white-space:pre-wrap;
line-height:1.7;
}
footer{
text-align:center;
padding:30px;
color:#888;
}
</style>
</head>

<body>

<header>
<div class="logo">🎵 FORK-MUSICA</div>
<p>Tu imaginación. Tu música. Tu mundo.</p>
</header>

<main>
<h1>Crea canciones con IA</h1>
<p class="descripcion">
Convierte tus ideas en canciones y descubre tu creatividad musical.
</p>

<div class="panel">

<label>¿De qué quieres que trate tu canción?</label>
<textarea id="idea" placeholder="Ejemplo: Una historia de amor que terminó, pero dejó recuerdos..."></textarea>

<label>Género musical</label>
<select id="genero">
<option>Pop</option>
<option>Reggaetón</option>
<option>Trap</option>
<option>Rock</option>
<option>Balada</option>
<option>Cumbia</option>
<option>Electrónica</option>
<option>Rap</option>
<option>Folklore</option>
</select>

<label>Estado de ánimo</label>
<select id="animo">
<option>Romántico</option>
<option>Triste</option>
<option>Feliz</option>
<option>Motivador</option>
<option>Melancólico</option>
<option>Enérgico</option>
</select>

<label>Nombre de tu canción</label>
<input id="titulo" placeholder="Mi nueva canción">

<button onclick="crearCancion()">✨ Crear mi canción</button>

<div id="resultado"></div>

</div>
</main>

<footer>
Fork-MUSICA © 2026 | Creando nuevos sonidos
</footer>

<script>
function crearCancion(){
const idea=document.getElementById("idea").value;
const genero=document.getElementById("genero").value;
const animo=document.getElementById("animo").value;
const titulo=document.getElementById("titulo").value;

if(!idea.trim()){
alert("Primero escribe la idea de tu canción.");
return;
}

document.getElementById("resultado").style.display="block";

document.getElementById("resultado").innerText=
"🎵 "+(titulo || "Mi nueva canción")+
"\n\nGénero: "+genero+
"\nEstado de ánimo: "+animo+
"\n\nTu idea musical:\n"+idea+
"\n\n✨ Tu proyecto musical está listo para desarrollar.\n\nPróximamente: generación de letras, voces e instrumentales con inteligencia artificial.";
}
</script>

</body>
</html>
